name: Oracle Parity

# Runs the @pytest.mark.slow oracle parity suite for JacobianLens.
# Not part of the standard PR gate — requires ~4 GB VRAM and network access.
# Triggered manually or automatically when the test file or this workflow changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev*
    paths:
      - "tests/integration/test_jacobian_lens_oracle_parity.py"
      - ".github/workflows/oracle-parity.yml"

permissions:
  contents: read

jobs:
  oracle-parity-checks:
    name: Oracle Parity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync

      - name: Install oracle (pinned ORACLE_COMMIT from test file)
        run: |
          ORACLE_COMMIT=$(python -c "
          import re, pathlib
          src = pathlib.Path('tests/integration/test_jacobian_lens_oracle_parity.py').read_text()
          print(re.search(r'ORACLE_COMMIT = \"([^\"]+)\"', src).group(1))
          ")
          uv pip install "git+https://github.com/anthropics/jacobian-lens.git@${ORACLE_COMMIT}"

      - name: Authenticate HuggingFace
        if: env.HF_TOKEN != ''
        run: uv run python -c "import os; from huggingface_hub import login; login(token=os.environ['HF_TOKEN'])"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Oracle Parity Test
        run: uv run pytest tests/integration/test_jacobian_lens_oracle_parity.py -v -m slow
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
